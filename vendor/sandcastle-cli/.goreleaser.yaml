version: 2

release:
  replace_existing_artifacts: true

builds:
  - binary: sandcastle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/sandcastle/cli/cmd.Version={{ .Version }} -X github.com/sandcastle/cli/cmd.Commit={{ .ShortCommit }} -X github.com/sandcastle/cli/cmd.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: sandcastle-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

## Notarization disabled — Apple Developer agreement expired (REQUIRED_AGREEMENTS_MISSING_OR_EXPIRED).
## Re-enable after renewing at https://developer.apple.com/account
