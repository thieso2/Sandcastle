#         key: "{{ .Env.MACOS_NOTARY_KEY }}"

# Homebrew publishing removed (2026-07-15): this pre-incus rails tool is
# superseded by github.com/thieso2/sandcastle-incus, which now owns the
# `sandcastle` name in thieso2/homebrew-tap as a Cask (Casks/sandcastle.rb).
# Re-adding a `brews` block here would regenerate Formula/sandcastle.rb and
# collide with that cask. See sandcastle-incus#101.
changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"
